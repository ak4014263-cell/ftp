version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: swiply-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swiply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swiply123}
      POSTGRES_DB: ${POSTGRES_DB:-swiply}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - swiply-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiply"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swiply-redis
    volumes:
      - redis_data:/data
    networks:
      - swiply-network
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: swiply-gateway
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-swiply}:${POSTGRES_PASSWORD:-swiply123}@postgres:5432/${POSTGRES_DB:-swiply}
      - AUTH_SERVICE_URL=http://auth:8001
      - USER_SERVICE_URL=http://profile:8004
      - JOB_SERVICE_URL=http://job:8003
      - PROFILE_SERVICE_URL=http://profile:8004
      - APPLICATION_SERVICE_URL=http://job:8003
      - AUTOMATION_SERVICE_URL=http://automation:8006
      - EMAIL_SERVICE_URL=http://email:8007
      - CREDENTIAL_SERVICE_URL=http://credential:8009
      - AI_SERVICE_URL=http://ai:8010
      - WTTJ_SERVICE_URL=http://wttj:8012
      - WTTJ_SCRAPER_SERVICE_URL=http://wttj_scraper:8013
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swiply-network
    restart: always

  auth:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: auth
        PORT: 8001
    container_name: swiply-auth
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-swiply}:${POSTGRES_PASSWORD:-swiply123}@postgres:5432/${POSTGRES_DB:-swiply}
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swiply-network
    restart: always

  profile:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: profile
        PORT: 8004
    container_name: swiply-profile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-swiply}:${POSTGRES_PASSWORD:-swiply123}@postgres:5432/${POSTGRES_DB:-swiply}
    expose:
      - "8004"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swiply-network
    restart: always

  job:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: job
        PORT: 8003
    container_name: swiply-job
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-swiply}:${POSTGRES_PASSWORD:-swiply123}@postgres:5432/${POSTGRES_DB:-swiply}
    expose:
      - "8003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swiply-network
    restart: always

  credential:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: credential
        PORT: 8009
    container_name: swiply-credential
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-swiply}:${POSTGRES_PASSWORD:-swiply123}@postgres:5432/${POSTGRES_DB:-swiply}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    expose:
      - "8009"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swiply-network
    restart: always

  email:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: email
        PORT: 8007
    container_name: swiply-email
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-swiply}:${POSTGRES_PASSWORD:-swiply123}@postgres:5432/${POSTGRES_DB:-swiply}
    expose:
      - "8007"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swiply-network
    restart: always

  automation:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: automation
        PORT: 8006
    container_name: swiply-automation
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-swiply}:${POSTGRES_PASSWORD:-swiply123}@postgres:5432/${POSTGRES_DB:-swiply}
      - HEADLESS=true
      - REDIS_HOST=redis
    expose:
      - "8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swiply-network
    restart: always

  ai:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: ai
        PORT: 8010
    container_name: swiply-ai
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    expose:
      - "8010"
    networks:
      - swiply-network
    restart: always

  # WTTJ Firefox Automation (with anti-blocking measures)
  wttj:
    build:
      context: .
      dockerfile: Dockerfile.wttj
    container_name: swiply-wttj
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-swiply}:${POSTGRES_PASSWORD:-swiply123}@postgres:5432/${POSTGRES_DB:-swiply}
      - REDIS_URL=redis://redis:6379/0
      - HEADLESS=true
      # Anti-blocking configuration
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_PORT=${PROXY_PORT:-}
      - PROXY_USERNAME=${PROXY_USERNAME:-}
      - PROXY_PASSWORD=${PROXY_PASSWORD:-}
      - RATE_LIMIT_PER_HOUR=${RATE_LIMIT_PER_HOUR:-20}
      - SESSION_PERSISTENCE_ENABLED=${SESSION_PERSISTENCE_ENABLED:-true}
    expose:
      - "8012"
    volumes:
      - ./screenshots:/app/screenshots
      - ./firefox_profile:/app/firefox_profile
      - ./browser_sessions:/app/browser_sessions  # Session persistence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swiply-network
    restart: always
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 2G

  wttj_scraper:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: wttj_scraper
        PORT: 8013
    container_name: swiply-wttj-scraper
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-swiply}:${POSTGRES_PASSWORD:-swiply123}@postgres:5432/${POSTGRES_DB:-swiply}
    expose:
      - "8013"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swiply-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swiply-frontend
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    expose:
      - "5173"
    networks:
      - swiply-network
    restart: always

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: swiply-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway
      - frontend
    networks:
      - swiply-network
    restart: always

volumes:
  postgres_data:
  redis_data:

networks:
  swiply-network:
    driver: bridge
